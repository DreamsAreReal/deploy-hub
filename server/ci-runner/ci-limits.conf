# Limits of the slice user-<uid of ci>.slice, installed as its drop-in by
# ci-runner setup. Every CI process (runners, rootless Docker, the user manager
# of ci and the build and gate containers it holds) runs there, so a build cannot starve tasks, router-bot or observability: at most 6
# of 8 CPUs, low CPU and IO weight, and a memory cap well below the host's.
[Slice]
CPUQuota=600%
CPUWeight=20
IOWeight=20
MemoryHigh=11G
MemoryMax=13G
MemorySwapMax=0
TasksMax=8192
