          - internal/hostsync.TestEveryActivationStepFailureRestores
          - internal/runner.TestHostSyncFailureRollsTheContainersBack
          - internal/runner.TestRollbackReinstallsTheTargetsHostFiles
      - id: self-update-installs-only-gated-releases
        category: security
        tests:
          - internal/selfupdate.TestRefusesReleasesThatAreNotGatedBuilds
          - internal/selfupdate.TestAPinnedTagIsLookedUpByName
          - internal/cli.TestSelfUpdateReplacesOnlyTheInstalledBinary
      - id: self-update-restores-on-failure
        category: business
