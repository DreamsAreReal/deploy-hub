apps:
  deploy-hub:
    repo: DreamsAreReal/deploy-hub
    kind: binary
    accepted_workflow_findings:
      - rule: self-hosted-runner
        severity: Medium
        file: .github/workflows/deploy.yml
        key: runs-on
        reason: >-
          Owner decision of 2026-10-22 in #633, for the runner of #600, #621 and #627: the app gate runs on
          the isolated self-hosted runner on the EU host (server/ci-runner). Each app repo has its own runner
          user (uid, #621) and rootless Docker daemon, the runners live in a network namespace that reaches
          only the internet (one namespace per repo: #627), in sandboxed units and a CPU/memory/disk slice.
          Owner decision of 2026-10-23 in #679: all repos are private and every job, the hub's own gate and
          release included, runs on this runner through this one runs-on line (no GitHub-hosted fallback).
          The job-started hook takes only workflows of main and of pull requests into main from the repo itself
          (owner decision of 2026-10-23 in #645: the pull request gate shares the runner, runs without deploy
          secrets; deploy-hub preempt on the host cancels it for a main deploy and re-runs it after, #679).
          This is the only accepted workflow finding.
    scenarios:
      - id: nothing-reaches-production-before-the-gate
        category: security
        tests:
          - e2e.TestNothingReachesProductionBeforeTheGatePasses
          - e2e.TestOnlyTheHubWorkflowCanDeploy
          - internal/selfupdate.TestRefusesReleasesThatAreNotGatedBuilds
      - id: only-the-hub-publishes-releases
        category: security
        tests:
          - e2e.TestOnlyTheHubPublishesReleases
          - e2e.TestDeployRunsOnlyOnTheEURunner
          - e2e.TestTheHubGatesItselfThroughDeployYML
      - id: preempt-cancels-only-pull-request-runs
        category: security
        tests:
          - internal/preempt.TestAWaitingMainDeployCancelsOnlyPullRequestRuns
          - internal/preempt.TestARunThatTurnsIntoAnotherEventIsNotCancelled
      - id: self-update-needs-the-host-token
        category: security
        tests:
          - internal/selfupdate.TestNoTokenRefusesBeforeAnyRequest
          - internal/selfupdate.TestWrongTokenIsReportedAsUnauthorized
          - internal/selfupdate.TestBootstrapRefusesWithoutAUsableToken
          - internal/selfupdate.TestBootstrapRefusesWithAWrongToken
      - id: forced-command-allows-only-runner-verbs
        category: security
        tests:
          - e2e.TestForcedCommandRefusesEverythingElse
          - internal/runner.TestRefusedRequests
      - id: unknown-app-is-refused
        category: security
        tests:
          - internal/runner.TestMissingAppsListRefusesNamedApps
      - id: tampered-request-parameters-are-refused
        category: security
        tests:
          - internal/runner.TestParseRequest
          - internal/runner.TestBYOCRejections
      - id: oversized-input-is-refused
        category: security
        tests:
          - internal/runner.TestOversizedMetaIsRejected
      - id: concurrent-deploys-are-serialized
        category: security
        tests:
          - internal/runner.TestLockBusy
      - id: rendered-compose-cannot-escape-limits
        category: security
        tests:
          - internal/compose.TestRenderRejectsUnsafeOutputs
      - id: provision-input-is-validated
        category: security
        tests:
          - internal/provision.TestRequestValidate
      - id: rendered-compose-binds-loopback-only
        category: security
        tests:
          - internal/compose.TestRenderRejectsPublicInterfaces
          - internal/compose.TestRenderBindsEveryPortToLoopback
      - id: deploy-requires-hub-workflow-identity
        category: security
        tests:
          - internal/oidc.TestVerifyRejectsForgedAndTamperedTokens
          - internal/oidc.TestVerifyRejectsClaims
          - internal/runner.TestDeployRequiresVerifiedIdentity
          - e2e.TestOnlyTheHubWorkflowCanDeploy
      - id: app-is-bound-to-its-repository
        category: security
        tests:
          - internal/runner.TestAppWithoutRepoBindingIsRefused
          - internal/runner.TestIdentityExpectationsAreBoundToAppAndCommit
          - internal/gate/catalog.TestRegistration
      - id: rollback-only-to-gated-versions
        category: security
        tests:
          - internal/runner.TestRollbackOnlyToDeployedVersions
          - e2e.TestRollbackCannotReachUngatedImages
      - id: gate-report-cannot-be-forged
        category: security
