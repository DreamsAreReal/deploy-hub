          - internal/relay.TestDisorderSendsTheFirstPartWithATTLOfOne
          - internal/relay.TestClientHandshakesThroughSplitHelloAndCountsWrites
      - id: other-traffic-is-relayed-unchanged
        category: business
        tests:
          - internal/relay.TestPlainTrafficIsRelayedBothWaysUnchanged
          - internal/relay.TestOtherSitesKeepTheirHelloIntact
          - internal/relay.TestDisorderLeavesOtherHelloAndPipesAlone
      - id: proxy-drops-connections-it-cannot-place
        category: security
        tests:
          - internal/relay.TestConnectionsWithoutAUsableTargetAreClosed
          - internal/relay.TestClientThatSendsNothingOn443IsClosed
          - cmd/tcp-split.TestTCPSplitDropsConnectionsThatWereNotRedirected
      - id: client-hello-parser-rejects-malformed-input
        category: security
        tests:
          - internal/tlshello.TestEveryTruncationIsRejected
          - internal/tlshello.TestParseRejectsBrokenServerNames
          - internal/tlshello.TestParseRejectsAnExtensionLongerThanTheHello
      - id: health-tells-internet-from-youtube
        category: business
        tests:
          - internal/health.TestInternetIsCheckedOnANonYouTubeSiteAndYouTubeSeparately
          - internal/health.TestBrokenVPSFailsTheRightChecks
          - cmd/vps-health.TestVPSHealthServesTheHealthDocument
      - id: youtube-falls-back-to-the-direct-path
        category: business
        tests:
          - wgru-watchdog.bats > a stale tunnel drops the YouTube route and is bounced
          - wgru-watchdog.bats > YouTube switched off in the bot goes direct without bouncing the tunnel
          - wgru-watchdog.bats > a fresh tunnel loads the QUIC reject rule and sends YouTube DNS through it
  observability:
    repo: DreamsAreReal/observability
    kind: worker
    scenarios:
      - id: config-volume-follows-the-gated-image
        category: business
        tests:
          - internal/configsync.TestSyncReplacesChangedFilesAndKeepsUnchangedOnes
          - internal/configsync.TestSyncRemovesFilesThatLeftTheBundle
          - internal/configsync.TestMainSyncsWaitsAndChecks
      - id: config-sync-copies-only-regular-files
        category: security
        tests:
          - internal/configsync.TestSyncRefusesWhatItCannotCopy
      - id: backups-are-consistent-and-checked
        category: business
        tests:
          - internal/backup.TestBackupSnapshotsTheDatabases
          - internal/backup.TestIntegrityCheckFailureIsAnError
          - internal/backup.TestUnchangedFilesAreHardLinksToThePreviousCopy
          - internal/backup.TestOffsiteFailures
      - id: backup-talks-only-to-this-host
        category: security
        tests:
          - internal/backup.TestFetchJSONOnlyTalksToThisHost
      - id: host-metrics-labels-cannot-break-the-format
        category: security
        tests:
          - internal/hostmetrics.TestLabelsAreEscapedAndSorted
      - id: sites-are-probed-with-verified-certificates
        category: security
        tests:
          - internal/hostmetrics.TestHTTPSProbeVerifiesTheCertificate
      - id: host-metrics-run-only-table-commands
        category: security
        tests:
          - internal/hostmetrics.TestExecRunsOnlyTableCommandsAndTimesOut
    host:
      files:
        - {src: obs-host-metrics, dst: /usr/local/sbin/obs-host-metrics, owner: root, group: root, mode: "0755"}
        - {src: obs-host-metrics.service, dst: /etc/systemd/system/obs-host-metrics.service, owner: root, group: root, mode: "0644"}
        - {src: obs-host-metrics.timer, dst: /etc/systemd/system/obs-host-metrics.timer, owner: root, group: root, mode: "0644"}
        - {src: app-backup, dst: /usr/local/sbin/app-backup, owner: root, group: root, mode: "0755"}
        - {src: app-backup.service, dst: /etc/systemd/system/app-backup.service, owner: root, group: root, mode: "0644"}
        - {src: app-backup.timer, dst: /etc/systemd/system/app-backup.timer, owner: root, group: root, mode: "0644"}
        - {src: app-backup-verify.service, dst: /etc/systemd/system/app-backup-verify.service, owner: root, group: root, mode: "0644"}
        - {src: app-backup-verify.timer, dst: /etc/systemd/system/app-backup-verify.timer, owner: root, group: root, mode: "0644"}
        - {src: obs-backfill-deploys, dst: /usr/local/sbin/obs-backfill-deploys, owner: root, group: root, mode: "0755"}
        - {src: ingest.caddy, dst: /etc/caddy/extra/observability-ingest.caddy, owner: root, group: caddy, mode: "0640", env: ingest.env}
      dirs:
        - {path: /var/lib/node_exporter/textfile, owner: root, group: root, mode: "0755"}
      timers: [obs-host-metrics.timer, app-backup.timer, app-backup-verify.timer]
      checks: [obs-host-metrics.service]
hub:
  sudo_user: deploy
  sudo_commands: [caddy-sync, host-sync, self-update]
