          - internal/selfupdate.TestRestoreThatFailsIsJournaled
      - id: sudoers-lists-only-policy-commands
        category: security
        tests:
          - internal/selfupdate.TestSudoersRuleAllowsOnlyTheListedCommands
          - internal/selfupdate.TestSudoersRefusedByVisudoKeepsThePreviousRule
          - internal/gate/policy.TestHubSudoCommandsComeFromAFixedList
  tasks:
