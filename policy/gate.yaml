owners:
  - DreamsAreReal
thresholds:
  line_coverage: 90
  branch_coverage: 90
  mutation_score: 90
  max_cognitive_complexity: 9
  max_duplication_percent: 2
  duplicate_min_tokens: 50
limits:
  check_timeout: 75m
  long_check_timeout: 3h
  fuzz_time: 15s
  fuzz_examples: 1000
  mutant_timeout_floor: 20s
  mutant_timeout_factor: 3
  findings_listed: 40
  stage_ready_timeout: 90s
licenses:
  - 0BSD
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - ISC
  - MIT
  - MPL-2.0
  - OFL-1.1
  - Unlicense
  - Zlib
  - blessing
reviewed_license_texts:
  "sha256:f597097efe3d97021f89170746bd3a0fb9a8b6fb26b82043ed68a4e0283bee6c": MIT
  "sha256:5ae5bee3072a841376451b48d8cfcec7188e10543926d5870828d36c8a750dc5": NONE
  "sha256:8438c9c89b849131ead81d5435cb97fcf052df5b0b286dda8a2d4c29e6cb3fd0": blessing
  "sha256:b4366b9c27a9364633e015011a231913ed19bf1228f335bf617e50a6f7b168a6": BSD-3-Clause AND MIT AND MPL-2.0 AND Apache-2.0 AND blessing
dependencies:
  - github.com/VictoriaMetrics/metrics
  - github.com/alecthomas/chroma/v2
  - github.com/coder/websocket
  - github.com/dlclark/regexp2/v2
  - github.com/dustin/go-humanize
  - github.com/fxamacker/cbor/v2
  - github.com/getsentry/sentry-go
  - github.com/go-viper/mapstructure/v2
  - github.com/go-webauthn/webauthn
  - github.com/go-webauthn/x
  - github.com/golang-jwt/jwt/v5
  - github.com/google/go-tpm
  - github.com/google/uuid
  - github.com/jmoiron/sqlx
  - github.com/mattn/go-isatty
  - github.com/ncruces/go-strftime
  - github.com/philhofer/fwd
  - github.com/remyoudompheng/bigfft
  - github.com/rivo/uniseg
  - github.com/tinylib/msgp
  - github.com/valyala/fastrand
  - github.com/valyala/histogram
  - github.com/x448/float16
  - github.com/yuin/goldmark
  - go.yaml.in/yaml/v3
  - golang.org/x/crypto
  - golang.org/x/image
  - golang.org/x/sys
  - golang.org/x/text
  - modernc.org/libc
  - modernc.org/mathutil
  - modernc.org/memory
  - modernc.org/sqlite
  - mvdan.cc/sh/v3
  - "npm:@types/node"
  - "npm:@types/whatwg-mimetype"
  - "npm:@types/ws"
  - "npm:@vue/reactivity"
  - "npm:@vue/shared"
  - "npm:alpinejs"
  - "npm:buffer-image-size"
  - "npm:entities"
  - "npm:fast-check"
  - "npm:happy-dom"
  - "npm:htmx.org"
  - "npm:pure-rand"
  - "npm:undici-types"
  - "npm:whatwg-mimetype"
  - "npm:ws"
forbidden_files:
  - "*state*.md"
  - "*.bak"
  - "*.orig"
  - "*.rej"
  - "*.swp"
  - "*.tmp"
  - "*~"
  - "*.log"
  - "*.out"
  - "*.prof"
  - "*.pprof"
  - "*.test"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - "id_rsa*"
  - "id_ed25519*"
  - ".env"
  - ".ds_store"
  - "coverage.out"
  - "coverage.html"
  - "coverage.txt"
  - "*.coverprofile"
  - "cover.out"
  - "__debug_bin*"
  - "*.sarif"
  - ".semgrepignore"
  - ".gitleaksignore"
  - ".gitleaks.toml"
  - ".trufflehogignore"
  - ".trivyignore*"
  - ".hadolint.y*ml"
  - ".golangci.y*ml"
  - "zizmor.y*ml"
  - "osv-scanner.toml"
  - ".snyk"
markers:
  - todo
  - fixme
  - hack
  - xxx
sast_rulesets:
  - p/default
  - p/security-audit
  - p/owasp-top-ten
  - p/cwe-top-25
  - p/secrets
  - p/golang
  - p/gosec
  - p/github-actions
  - p/dockerfile
  - p/docker-compose
images:
  semgrep: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
  zap: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
apps:
  deploy-hub:
    repo: DreamsAreReal/deploy-hub
    kind: binary
    scenarios:
      - id: forced-command-allows-only-runner-verbs
        category: security
        tests:
          - e2e.TestForcedCommandRefusesEverythingElse
          - internal/runner.TestRefusedRequests
      - id: unknown-app-is-refused
        category: security
        tests:
          - internal/runner.TestMissingAppsListRefusesNamedApps
      - id: tampered-request-parameters-are-refused
        category: security
        tests:
          - internal/runner.TestParseRequest
          - internal/runner.TestBYOCRejections
      - id: oversized-input-is-refused
        category: security
        tests:
          - internal/runner.TestOversizedMetaIsRejected
      - id: concurrent-deploys-are-serialized
        category: security
        tests:
          - internal/runner.TestLockBusy
      - id: rendered-compose-cannot-escape-limits
        category: security
        tests:
          - internal/compose.TestRenderRejectsUnsafeOutputs
      - id: provision-input-is-validated
        category: security
        tests:
          - internal/provision.TestRequestValidate
      - id: rendered-compose-binds-loopback-only
        category: security
        tests:
          - internal/compose.TestRenderRejectsPublicInterfaces
          - internal/compose.TestRenderBindsEveryPortToLoopback
      - id: deploy-requires-hub-workflow-identity
        category: security
        tests:
          - internal/oidc.TestVerifyRejectsForgedAndTamperedTokens
          - internal/oidc.TestVerifyRejectsClaims
          - internal/runner.TestDeployRequiresVerifiedIdentity
          - e2e.TestOnlyTheHubWorkflowCanDeploy
      - id: app-is-bound-to-its-repository
        category: security
        tests:
          - internal/runner.TestAppWithoutRepoBindingIsRefused
          - internal/runner.TestIdentityExpectationsAreBoundToAppAndCommit
          - internal/gate/catalog.TestRegistration
      - id: rollback-only-to-gated-versions
        category: security
        tests:
          - internal/runner.TestRollbackOnlyToDeployedVersions
          - e2e.TestRollbackCannotReachUngatedImages
      - id: gate-report-cannot-be-forged
        category: security
        tests:
          - internal/runner.TestReportRejections
          - internal/gate.TestDecodeRejects
      - id: untrusted-input-is-fuzzed
        category: security
        tests:
          - internal/runner.FuzzParseRequest
          - internal/runner.FuzzReadMeta
          - internal/compose.FuzzRender
          - internal/oidc.FuzzVerify
          - internal/gate.FuzzDecode
      - id: toolchain-downloads-are-verified
        category: security
        tests:
          - internal/tools.TestInstallFailures
      - id: deploy-lifecycle
        category: business
        tests:
          - e2e.TestDeployLifecycle
      - id: broken-release-keeps-serving
        category: business
        tests:
          - e2e.TestBrokenReleaseKeepsServing
          - internal/runner.TestBrokenReleaseIsDiscardedAndProdUntouched
      - id: zero-downtime-cutover
        category: business
        tests:
          - internal/runner.TestBlueGreenSwapIsZeroDowntime
      - id: rollback-to-previous
        category: business
        tests:
          - internal/runner.TestRollbackToPrevious
      - id: failed-first-deploy-stops-app
        category: business
        tests:
          - internal/runner.TestFirstDeployFailureStopsApp
      - id: gate-verdict-reaches-logs-and-metrics
        category: business
        tests:
          - e2e.TestGateVerdictIsRecorded
          - internal/runner.TestReportRecordsBlockedVerdict
          - internal/runner.TestReportRecordsPassedVerdict
      - id: any-failed-check-blocks-the-deploy
        category: business
        tests:
          - internal/gate.TestRunnerCollectsResults
          - internal/gate.TestUnfinishedCheckFails
  tasks:
    repo: DreamsAreReal/tasks
    kind: service
    port: 8787
    health: /api/health
    cpus: "1"
    memory: 128m
    dast: {target: /, spider: 1m, max_time: 10m}
    load: {rate: 20, duration: 30s, p95: 300ms, max_error_percent: 0, concurrency: 10, paths: [/api/health, /]}
    localized:
      - internal/texts/
      - internal/web/static/
      - internal/seed/*.json
      - widget/
      - testdata/
      - tools/e2e/
      - docs/
      - "*_test.go"
    allowed_files:
      - docs/STATE.md
      - docs/tasks/*/STATE.md
    scenarios:
      - id: unknown-or-retired-token-is-refused
        category: security
        tests:
          - internal/server.TestUnknownTokenIsRefusedAndOnlyItsHashIsStored
          - internal/domain.TestRetiredTokensAreRefused
      - id: app-api-is-closed-without-a-session
        category: security
        tests:
          - internal/server.TestAppAPIIsClosedWithoutASession
          - internal/server.TestHumanAPIStaysClosedWithoutDevLogin
          - internal/server.TestLiveSocketRefusesAStranger
      - id: agent-acts-only-within-its-scope
        category: security
        tests:
          - internal/server.TestOwnResourceWithoutTheScopeIsForbidden
          - internal/server.TestAgentEditsOnlyItsEpics
          - internal/server.TestAgentMayNotCloseOrCancelAnyTask
          - internal/runner/mcp.TestSetStageRefusesClosingStagesAndPointsToReview
      - id: login-codes-are-single-use-and-rate-limited
        category: security
        tests:
          - internal/domain.TestLoginCodeWorksOnceInAnyCase
          - internal/domain.TestLoginCodeExpires
          - internal/domain.TestLoginCodeLocksAfterMisses
          - internal/server.TestWrongCodeCreatesNobody
      - id: passkeys-belong-to-their-user
        category: security
        tests:
          - internal/domain.TestPasskeysBelongToTheirUser
      - id: signed-file-links-expire
        category: security
        tests:
          - internal/domain.TestSignedLinksExpireAndDieWithTheSecret
      - id: uploads-are-size-checked
        category: security
        tests:
          - internal/domain.TestEmptyAndOversizeFilesAreRefusedByName
      - id: user-markdown-cannot-inject-html
        category: security
        tests:
          - internal/server.TestFeedRendersMarkdownWithoutRawHTML
      - id: runner-paths-stay-inside-their-base
        category: security
        tests:
          - internal/runner.TestContextFileOutsideTheFolderIsRefused
          - internal/runner.TestWorkdirOutsideTheBaseIsRefused
      - id: agent-notes-do-not-leak-secrets
        category: security
        tests:
          - internal/runner/mcp.TestNoteMasksSecretsFromTheEnvironment
      - id: malformed-input-is-refused
        category: security
        tests:
          - internal/server.TestAlertIntakeRejectsGarbage
          - internal/server.TestTaskCreationRefusesBadInput
          - internal/server.TestIdempotencyKeyReplaysTheAnswerAndRefusesAnotherBody
      - id: backups-never-destroy-data
        category: security
        tests:
          - internal/sqlitebackup.TestACorruptFileIsNeverRestored
          - internal/sqlitebackup.TestRestoreNeverOverwritesADatabase
      - id: untrusted-input-is-fuzzed
        category: security
        tests:
          - internal/jsvalue.FuzzNumber
          - internal/server.FuzzDecodeAlerts
          - internal/server.FuzzIncomingText
          - internal/server.FuzzMultipartField
          - internal/server.FuzzParseGCPDelivery
          - internal/server.FuzzParseGenericDelivery
          - internal/server.FuzzParseGitHubDelivery
          - internal/server.FuzzParseGitLabDelivery
          - internal/web.FuzzMarkdown
      - id: task-lifecycle
        category: business
        tests:
          - internal/server.TestTaskIsCreatedTrimmedInTheBacklog
          - internal/server.TestPatchChangesFieldsAndWritesTheFeed
          - internal/server.TestReopenReturnsAClosedTaskToWork
          - internal/server.TestTaskIsDeletedAndRestored
      - id: agent-claims-works-and-reports
        category: business
        tests:
          - internal/server.TestClaimedTaskIsNotHandedOutTwice
          - internal/server.TestAgentReportsLandInTheFeed
          - internal/server.TestAgentCreatesFollowUpTasksAndEpics
      - id: question-and-answer
        category: business
        tests:
          - internal/server.TestAnswerClosesTheQuestion
      - id: comments-and-files
        category: business
        tests:
          - internal/server.TestCommentIsAddedEditedAndRemoved
          - internal/server.TestFileIsAttachedAndRemoved
      - id: alerts-open-tasks
        category: business
        tests:
          - internal/server.TestVmalertFiringOpensOneTaskInAlertsEpic
      - id: device-enrollment
        category: business
        tests:
          - internal/server.TestCodeFromTheAppEnrollsAnotherDevice
      - id: live-updates
        category: business
        tests:
          - internal/server.TestLiveSocketTellsAboutEveryWrite
      - id: health-and-backup
        category: business
        tests:
          - internal/server.TestHealthReportsCountsWithoutAToken
          - internal/store.TestBackupThenRestoreKeepsData
  router-bot:
    repo: DreamsAreReal/router-bot
    kind: service
    port: 8080
    health: /healthz
    cpus: "0.5"
    memory: 64m
    env:
      - ROUTER_TOKEN=gate-stage-only-router-token-000000
      - PUBLIC_URL=http://localhost:8080
    dast: {target: /, spider: 1m, max_time: 10m}
    load: {rate: 20, duration: 30s, p95: 300ms, max_error_percent: 0, concurrency: 10, paths: [/healthz, /login]}
    localized:
      - internal/core/
      - internal/tracker/
      - internal/web/
      - docs/
      - "*_test.go"
    allowed_files:
      - docs/STATE.md
      - docs/tasks/*/STATE.md
    scenarios:
      - id: report-token-is-required
        category: security
        tests:
          - internal/core.TestRejectsWrongToken
          - internal/api.TestReportAuthorization
      - id: pages-need-sign-in
        category: security
        tests:
          - internal/core.TestPagesNeedSignIn
      - id: cross-site-form-is-refused
        category: security
        tests:
          - internal/core.TestCrossSiteFormIsRefused
          - internal/web.TestLocalPathRejectsOtherSites
      - id: malformed-or-oversized-report-is-refused
        category: security
        tests:
          - internal/core.TestBadReportLogsReason
          - internal/router.TestCheckupCleanCapsSize
          - internal/router.TestCleanDropsBadMACs
      - id: router-commands-are-allowlisted
        category: security
        tests:
          - internal/router.TestValidCommand
          - internal/core.TestRejectsUnknownCommand
          - internal/core.TestDeviceButtonQueuesCommand
      - id: rendered-html-keeps-only-safe-tags
        category: security
        tests:
          - internal/web.TestRichKeepsOnlySafeTags
      - id: alerts-hide-secrets
        category: security
        tests:
          - internal/core.TestSettingsAlertHidesSecretsAndSkipsOwn
      - id: report-is-stored-and-shown
        category: business
        tests:
          - internal/core.TestEveryScreenRenders
          - internal/core.TestNewDeviceAlertHasButtons
      - id: router-command-round-trip
        category: business
        tests:
          - internal/core.TestBlockCommandRoundTrip
      - id: alerts-open-tracker-tasks
        category: business
        tests:
          - internal/tracker.TestNewDeviceOpensTaskWithLink
          - internal/tracker.TestTunnelUpResolvesTunnelDown
      - id: router-metrics-are-exposed
        category: business
        tests:
          - internal/core.TestMetricsExposeRouterStats
      - id: passkey-sign-in-only
        category: security
        tests:
          - internal/web.TestEnrollWithCodeSignsIn
          - internal/web.TestEnrollCodeIsSingleUse
          - internal/web.TestEnrollRefusals
          - internal/web.TestLoginRefusals
          - internal/web.TestCrossSiteAuthIsRefused
      - id: sessions-expire
        category: security
        tests:
          - internal/web.TestSessionsExpireAndPrune
          - internal/store.TestSessions
      - id: untrusted-report-input-is-fuzzed
        category: security
        tests:
          - internal/router.FuzzClean
          - internal/router.FuzzParseBlock
      - id: storage-failures-surface
        category: security
        tests:
          - internal/core.TestEveryStoreFailureIsReturned
          - internal/store.TestEveryFailureIsReturned
          - internal/web.TestStoreFailuresGiveErrorPages
          - internal/api.TestReportStoreFailures
      - id: owner-signs-in-with-a-passkey
        category: business
        tests:
          - internal/web.TestLoginWithPasskey
          - internal/web.TestKeysPage
