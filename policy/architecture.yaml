link_budget: 14
tasks_callers:
  - runner
  - caddy
services:
  deploy-hub:
    owner: DreamsAreReal
    critical: high
    gives: [logs, metrics, events]
    calls:
      - to: github
        why: releases, CI status and the self-update check need the GitHub API
    secrets: [GH_TOKEN, GH_OWNER, RELEASE_TOKEN, VPS_SSH_KEY]
  tasks:
    owner: DreamsAreReal
    critical: high
    gives: [logs, metrics, errors]
    exposes:
      - site: tasks
      - port: 8787
    calls:
      - to: stt
        why: dictation audio from the browser is passed to the speech service
      - to: observability
        why: delivery steps of deploy-hub and the error records the assistant watches are read from VictoriaLogs
      - to: observability
        why: errors go to Bugsink through the Sentry SDK
    secrets: [STT_TOKEN, TASKS_AGENT_TOKEN, SENTRY_DSN, SENTRY_DSN_RUNNER, SENTRY_DSN_WEB]
    config: [HOST, PORT, METRICS_PORT, DB_PATH, REQUIRE_DATA_MOUNT, DEV_LOGIN, PUBLIC_URL, STT_URL, AGENT_BASE_DIR, TASKS_API_URL, TASKS_AGENT_EPIC, AGENT_STATE_DIR, DELIVERY_LOGS_URL, SECRETS_CATALOG]
    data: [/data]
  stt:
    owner: DreamsAreReal
    critical: low
    gives: [logs, metrics]
    exposes:
      - port: 8790
    secrets: [STT_TOKENS]
  runner:
    owner: DreamsAreReal
    critical: high
    external: true
    gives: [logs, metrics, errors]
    calls:
      - to: tasks
        why: the runner takes tasks, reports runs and collects sources for the tracker
      - to: github
        why: agents push task branches
      - to: anthropic
        why: Claude Code runs the agents and the assistant on the owner's subscription
      - to: router-bot
        why: collects the router source of the assistant through the read-only API
    secrets: [TASKS_AGENT_TOKEN, TASKS_ASSISTANT_TOKEN, CLAUDE_CREDENTIALS]
  router-bot:
    owner: DreamsAreReal
    critical: normal
    gives: [logs, metrics, errors]
    exposes:
      - site: router-bot
      - port: 8080
    calls:
      - to: router
        why: reads and changes the home router through its API
      - to: telegram
        why: owner chat of the bot
      - to: observability
        why: errors go to Bugsink through the Sentry SDK
      - to: tasks
        why: posts its own alerts to the tracker instead of vmalert
        until: "2026-12-31"
        task: "#785"
    secrets: [ROUTER_TOKEN, READ_TOKEN, TELEGRAM_BOT_TOKEN, SENTRY_DSN, ROUTER_SENTRY_DSN, TASKS_ALERTS_URL]
    config: [OWNER_CHAT_ID, PUBLIC_URL]
    data: [/data]
  observability:
    owner: DreamsAreReal
    critical: high
    gives: [logs, metrics]
    exposes:
      - port: 8428
      - port: 9428
      - port: 8000
      - site: bugsink
    calls:
      - to: tasks
        why: vmalert posts alerts to the tracker, the only alert channel today
        until: "2026-12-31"
        task: "#785"
    secrets: [SECRET_KEY, CREATE_SUPERUSER, INGEST_TOKEN, notifier_url]
    config: [INGEST_HOST, ALLOWED_HOSTS, BASE_URL, SNAPPEA_NUM_WORKERS, TIME_ZONE]
  router-ax23:
    owner: DreamsAreReal
    critical: high
    external: true
    gives: [metrics]
    calls:
      - to: moscow-vps
        why: the WireGuard tunnel for traffic that must leave through Moscow
  caddy:
    owner: DreamsAreReal
    critical: high
    external: true
    gives: [logs]
    calls:
      - to: tasks
        why: HTTPS front of every site
  router:
    owner: DreamsAreReal
    critical: high
    external: true
  moscow-vps:
    owner: DreamsAreReal
    critical: normal
    external: true
  github:
    owner: GitHub
    critical: high
    external: true
  telegram:
    owner: Telegram
    critical: low
    external: true
  anthropic:
    owner: Anthropic
    critical: high
    external: true
