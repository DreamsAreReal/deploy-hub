[tool.vulture]
min_confidence = 60
ignore_decorators = [
    "@*.route", "@*.get", "@*.post", "@*.put", "@*.patch", "@*.delete", "@*.head", "@*.options", "@*.websocket",
    "@*.fixture", "@pytest.fixture", "@*.command", "@*.group", "@*.task", "@*.on_event", "@*.middleware",
    "@*.exception_handler", "@*.validator", "@*.field_validator", "@*.model_validator", "@*.receiver", "@*.handler",
]
ignore_names = [
    "do_*", "log_message", "server_version",
    "intra_op_num_threads", "inter_op_num_threads", "enable_cpu_mem_arena", "enable_mem_pattern",
]
