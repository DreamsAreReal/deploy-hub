name: deploy

on:
  workflow_call:
    inputs:
      app:
        description: App name, must match the central gate policy and apps.list on the VPS
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile inside the repo, used when the repo has no compose file
        required: false
        type: string
        default: Dockerfile
      compose:
        description: Path to the compose file inside the repo; empty means the first of docker-compose.yml, docker-compose.yaml, compose.yml in the repo root
        required: false
        type: string
        default: ""
    secrets:
      VPS_SSH_KEY:
        required: false
      VPS_HOST:
        required: false
      VPS_HOST_KEY:
        required: false

permissions: {}

jobs:
  preempt:
    name: preempt pull request gates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
    outputs:
      runs: ${{ steps.cancel.outputs.runs }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel pull request gates until the deploy job holds the runner
        id: cancel
        run: |
          set -euo pipefail
          cancelled=()
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            for status in in_progress queued waiting pending requested; do
              for id in $(gh api -X GET "repos/$REPO/actions/runs" -f event=pull_request \
                  -f status="$status" -F per_page=100 --jq '.workflow_runs[].id'); do
                echo "cancelling pull request gate run $id ($status)"
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null || true
                cancelled+=("$id")
              done
            done
            state="$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '[.jobs[] | select(.name | endswith("gate and deploy")) | .status][0] // "queued"')"
            case "$state" in
              queued | waiting | pending | requested) ;;
              *) break ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::the deploy job is still $state; pull request gates may take the runner first"
              break
            fi
            sleep 10
          done
          echo "runs=$(printf '%s\n' "${cancelled[@]}" | sort -u | xargs)" >> "$GITHUB_OUTPUT"

  requeue:
    name: requeue pull request gates
    needs: [preempt, deploy]
    if: always() && needs.preempt.outputs.runs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUNS: ${{ needs.preempt.outputs.runs }}
    steps:
      - name: Re-run the latest cancelled gate of each pull request
        run: |
          set -euo pipefail
          for id in $RUNS; do
            printf '%s' "$id" | grep -Eq '^[0-9]+$' || continue
            read -r workflow branch conclusion < <(gh api "repos/$REPO/actions/runs/$id" \
              --jq '[.workflow_id, .head_branch, .conclusion] | @tsv')
            latest="$(gh api -X GET "repos/$REPO/actions/workflows/$workflow/runs" -f event=pull_request \
              -f branch="$branch" -F per_page=1 --jq '.workflow_runs[0].id')"
            if [ "$conclusion" = cancelled ] && [ "$latest" = "$id" ]; then
              echo "re-running pull request gate run $id ($branch)"
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun" > /dev/null \
                || echo "::warning::could not re-run $id; re-run it from the pull request"
            fi
          done

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'gate' || 'gate and deploy' }}
    runs-on: >-
      ${{ (vars.DEPLOY_HUB_RUNNER == 'github-hosted' || !github.event.repository.private || github.event.repository.fork
      || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository))
      && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "eu"]') }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      APP: ${{ inputs.app }}
      GATE_ONLY: ${{ github.event_name == 'pull_request' }}
      VPS_USER: deploy
      OIDC_AUDIENCE: deploy-hub
    steps:
      - name: Validate inputs
        id: inputs
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE: ${{ inputs.compose }}
          HAS_SECRETS: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' && secrets.VPS_HOST_KEY != '' }}
        run: |
          if [ "$GATE_ONLY" != true ] && [ "$HAS_SECRETS" != true ]; then
            echo "a deploy needs the secrets VPS_SSH_KEY, VPS_HOST and VPS_HOST_KEY"; exit 1
          fi
          printf '%s' "$APP" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,40}$' \
            || { echo "invalid app name: $APP"; exit 1; }
          printf '%s' "$DOCKERFILE" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' \
            || { echo "invalid dockerfile path"; exit 1; }
          case "$DOCKERFILE" in
            /*|..|../*|*/../*|*/..) echo "dockerfile must stay inside the repo"; exit 1 ;;
          esac
          if [ -n "$COMPOSE" ]; then
            printf '%s' "$COMPOSE" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' \
              || { echo "invalid compose path"; exit 1; }
            case "$COMPOSE" in
              /*|..|../*|*/../*|*/..) echo "compose must stay inside the repo"; exit 1 ;;
            esac
          fi

      - name: Record start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -m / "$RUNNER_TEMP"
          # Preinstalled SDKs the gate never uses; its own toolchain is pinned in policy/tools.yaml.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/julia*
          docker system prune -af --volumes > /dev/null
          df -m / "$RUNNER_TEMP"

      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain
        id: hub
        uses: DreamsAreReal/deploy-hub/.github/actions/hub@6cb282c83d4f5c122ed32350a8c8ff014945f8f8

      - name: Resolve build inputs
        id: ctx
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE: ${{ inputs.compose }}
          TOOLCHAIN: ${{ steps.hub.outputs.bin }}
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          compose="$COMPOSE"
          if [ -n "$compose" ] && [ ! -f "$compose" ]; then
            echo "compose file not found: $compose"; exit 1
          fi
          for f in docker-compose.yml docker-compose.yaml compose.yml; do
            if [ -z "$compose" ] && [ -f "$f" ]; then compose="$f"; fi
          done
          if [ -n "$compose" ]; then
            META="$(deploy-hub render "$APP" "$compose" "$RUNNER_TEMP/rendered-compose.yml")"
            printf '%s\n' "$META"
            { echo "byoc=1"; printf '%s\n' "$META"; } >> "$GITHUB_OUTPUT"
          else
            {
              echo "byoc=0"
              echo "dockerfile=$DOCKERFILE"
              echo "context=$(dirname "$DOCKERFILE")"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: image
        env:
          DOCKERFILE: ${{ steps.ctx.outputs.dockerfile }}
          CONTEXT: ${{ steps.ctx.outputs.context }}
        run: |
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${APP}"
          TAG="sha-${GITHUB_SHA}"
          docker build \
            -f "$DOCKERFILE" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:$TAG" "$CONTEXT"
          { echo "image=$IMAGE"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"

      - name: Quality gate
        id: gate
        env:
          POLICY: ${{ steps.hub.outputs.policy }}
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          FORK: ${{ github.event.repository.fork }}
          TOOLCHAIN: ${{ steps.hub.outputs.bin }}
        run: |
          set -o pipefail
          export PATH="$TOOLCHAIN:$PATH"
          extra=()
          if [ "$FORK" = "true" ]; then extra+=(--fork); fi
          while sleep 30; do
            echo "resources: $(free -m | awk '/^Mem:/ {print "mem_available_mb=" $7}') $(df -m / "$RUNNER_TEMP" | awk 'NR > 1 {print $6 "_free_mb=" $4}' | tr '\n' ' ')top_dirs_mb=$(du -xsm "$RUNNER_TEMP"/gate/* /tmp 2>/dev/null | sort -rn | head -3 | awk '{printf "%s:%s,", $2, $1}')"
          done &
          deploy-hub gate --app "$APP" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --policy "$POLICY" --src "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/gate" --image "$IMAGE" "${extra[@]}"

      - name: Keep gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-reports
          path: |
            ${{ runner.temp }}/gate/verdict.json
            ${{ runner.temp }}/gate/**/mutation.json
            ${{ runner.temp }}/gate/sbom-*.cdx.json
          if-no-files-found: ignore

      - name: Summarize the verdict
        if: always()
        run: |
          verdict="$RUNNER_TEMP/gate/verdict.json"
          if [ ! -s "$verdict" ]; then
            echo "No gate verdict: a step before the gate failed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '"## Gate \(if .passed then "passed" else "failed" end): \(.app) \(.commit[0:7]), \(.seconds | floor) s",
            "", "| check | status | seconds | reason |", "|---|---|---|---|",
            (.results[] | "| \(.check) | \(.status) | \(.seconds | floor) | \(.reason // "" | gsub("[|\n]"; " ")) |")' \
            "$verdict" >> "$GITHUB_STEP_SUMMARY"

      - name: Connect to the VPS
        if: always() && github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Report the verdict to the hub
        if: always() && steps.inputs.outcome == 'success' && github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          TOOLCHAIN: ${{ steps.hub.outcome }}
          BUILD_INPUTS: ${{ steps.ctx.outcome }}
          IMAGE_BUILD: ${{ steps.image.outcome }}
        run: |
          set -euo pipefail
          verdict="$RUNNER_TEMP/gate/verdict.json"
          if [ ! -s "$verdict" ]; then
            stage=gate
            for pair in "checkout=$CHECKOUT" "toolchain=$TOOLCHAIN" "build-inputs=$BUILD_INPUTS" "image-build=$IMAGE_BUILD"; do
              if [ "${pair#*=}" != success ]; then stage="${pair%%=*}"; break; fi
            done
            echo "no gate verdict was produced; reporting the failed step: $stage"
            mkdir -p "$RUNNER_TEMP/gate"
            jq -n --arg app "$APP" --arg repo "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" --arg check "ci-$stage" \
              '{app: $app, repo: $repo, commit: $commit, own: false, passed: false, seconds: 0,
                results: [{check: $check, status: "fail", reason: "the CI step failed before the gate produced a verdict", seconds: 0}]}' \
              > "$verdict"
          fi
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)"
          {
            printf 'oidc=%s\n' "$oidc"
            printf 'verdict=%s\n' "$(base64 -w0 "$verdict")"
          } | ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                "$VPS_USER@$VPS_HOST" "report $APP sha-${GITHUB_SHA}"

      - name: Push the gated image
        id: push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"
          docker logout ghcr.io
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Deploy on the VPS
        if: github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          START_EPOCH: ${{ steps.start.outputs.epoch }}
          DIGEST: ${{ steps.push.outputs.digest }}
          BYOC: ${{ steps.ctx.outputs.byoc }}
          BYOC_MAIN: ${{ steps.ctx.outputs.main }}
          BYOC_PORT: ${{ steps.ctx.outputs.port }}
          BYOC_HEALTH: ${{ steps.ctx.outputs.health }}
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s | tr -d '\r\n' | cut -c1-120)"
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)"
          {
            printf 'token=%s\n' "$GH_TOKEN"
            printf 'actor=%s\n' "$ACTOR"
            printf 'subject=%s\n' "$SUBJECT"
            printf 'start=%s\n' "$START_EPOCH"
            printf 'oidc=%s\n' "$oidc"
            printf 'digest=%s\n' "$DIGEST"
            if [ "$BYOC" = 1 ]; then
              printf 'compose=%s\n' "$(base64 -w0 "$RUNNER_TEMP/rendered-compose.yml")"
              printf 'main=%s\n' "$BYOC_MAIN"
              printf 'hport=%s\n' "$BYOC_PORT"
              printf 'hmode=%s\n' "$BYOC_HEALTH"
            fi
          } | ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                "$VPS_USER@$VPS_HOST" "deploy $APP sha-${GITHUB_SHA}"
