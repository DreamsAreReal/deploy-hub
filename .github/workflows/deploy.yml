name: deploy

on:
  workflow_call:
    inputs:
      app:
        description: App name, must match the central gate policy and apps.list on the VPS
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile inside the repo, used when the repo has no compose file
        required: false
        type: string
        default: Dockerfile
      compose:
        description: Path to the compose file inside the repo; empty means the first of docker-compose.yml, docker-compose.yaml, compose.yml in the repo root
        required: false
        type: string
        default: ""
      image:
        description: Build and gate a container image; false for a kind binary app, which the hub only gates (nothing is deployed)
        required: false
        type: boolean
        default: true
    secrets:
      VPS_SSH_KEY:
        required: false
      VPS_HOST:
        required: false
      VPS_HOST_KEY:
        required: false
      RELEASE_TOKEN:
        description: Fine-grained PAT (Contents read and write, deploy-hub only) that publishes the hub release; only the hub passes it
        required: false

permissions: {}

jobs:
  deploy:
    name: ${{ (github.event_name == 'pull_request' || !inputs.image || (github.repository == 'DreamsAreReal/deploy-hub' && inputs.app == 'deploy-hub')) && 'gate' || 'gate and deploy' }}
    runs-on: ${{ fromJSON('["self-hosted", "linux", "eu"]') }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      APP: ${{ inputs.app }}
      HUB: ${{ github.repository == 'DreamsAreReal/deploy-hub' && inputs.app == 'deploy-hub' }}
      GATE_ONLY: ${{ github.event_name == 'pull_request' || !inputs.image || (github.repository == 'DreamsAreReal/deploy-hub' && inputs.app == 'deploy-hub') }}
      VPS_USER: deploy
      OIDC_AUDIENCE: deploy-hub
    steps:
      - name: Validate inputs
        id: inputs
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE: ${{ inputs.compose }}
          HAS_SECRETS: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' && secrets.VPS_HOST_KEY != '' }}
        run: |
          if [ "$GATE_ONLY" != true ] && [ "$HAS_SECRETS" != true ]; then
            echo "a deploy needs the secrets VPS_SSH_KEY, VPS_HOST and VPS_HOST_KEY"; exit 1
          fi
          printf '%s' "$APP" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,40}$' \
            || { echo "invalid app name: $APP"; exit 1; }
          printf '%s' "$DOCKERFILE" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' \
            || { echo "invalid dockerfile path"; exit 1; }
          case "$DOCKERFILE" in
            /*|..|../*|*/../*|*/..) echo "dockerfile must stay inside the repo"; exit 1 ;;
          esac
          if [ -n "$COMPOSE" ]; then
            printf '%s' "$COMPOSE" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' \
              || { echo "invalid compose path"; exit 1; }
            case "$COMPOSE" in
              /*|..|../*|*/../*|*/..) echo "compose must stay inside the repo"; exit 1 ;;
            esac
          fi

      - name: Record start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain
        id: hub
        if: env.HUB != 'true'
        uses: DreamsAreReal/deploy-hub/.github/actions/hub@f56850a4467f7e7a66a8b25d6e2a5f2030dada98

      - name: Set up Go for the hub commit under test
        if: env.HUB == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain of the hub commit under test
        id: own
        if: env.HUB == 'true'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/deploy-hub-toolchain"
          make toolchain TOOLS_DIR="$bin"
          { echo "bin=$bin"; echo "policy=$GITHUB_WORKSPACE/policy/gate.yaml"; } >> "$GITHUB_OUTPUT"

      - name: Resolve build inputs
        id: ctx
        if: env.HUB != 'true'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE: ${{ inputs.compose }}
          TOOLCHAIN: ${{ steps.hub.outputs.bin || steps.own.outputs.bin }}
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          compose="$COMPOSE"
          if [ -n "$compose" ] && [ ! -f "$compose" ]; then
            echo "compose file not found: $compose"; exit 1
          fi
          for f in docker-compose.yml docker-compose.yaml compose.yml; do
            if [ -z "$compose" ] && [ -f "$f" ]; then compose="$f"; fi
          done
          if [ -n "$compose" ]; then
            META="$(deploy-hub render "$APP" "$compose" "$RUNNER_TEMP/rendered-compose.yml")"
            printf '%s\n' "$META"
            { echo "byoc=1"; printf '%s\n' "$META"; } >> "$GITHUB_OUTPUT"
          else
            {
              echo "byoc=0"
              echo "dockerfile=$DOCKERFILE"
              echo "context=$(dirname "$DOCKERFILE")"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: image
        if: env.HUB != 'true' && inputs.image
        env:
          DOCKERFILE: ${{ steps.ctx.outputs.dockerfile }}
          CONTEXT: ${{ steps.ctx.outputs.context }}
        run: |
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${APP}"
          TAG="sha-${GITHUB_SHA}"
          chmod -R go+rX,go-w -- "$CONTEXT"
          docker build \
            -f "$DOCKERFILE" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:$TAG" "$CONTEXT"
          { echo "image=$IMAGE"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"

      - name: Connect to the VPS
        if: always() && env.GATE_ONLY != 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Fetch the mutation cache from the hub
        id: cache
        if: env.GATE_ONLY != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/mutation-cache"
          fetch() {
            install -d -m 700 "$dir" || return 1
            oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -er .value)" || return 1
            printf 'oidc=%s\n' "$oidc" | ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$VPS_USER@$VPS_HOST" \
              "mutation-cache-get $APP sha-${GITHUB_SHA}" > "$dir/served" || return 1
            : > "$dir/outputs"
            last="$(sed -n 's/^last=//p' "$dir/served")"
            if [ -n "$last" ]; then
              printf '%s' "$last" | base64 -d > "$dir/last.json" || return 1
              echo "last=$dir/last.json" >> "$dir/outputs"
            fi
            sum="$(sed -n 's/^sha256=//p' "$dir/served")"
            if [ -n "$sum" ]; then
              sed -n 's/^verdicts=//p' "$dir/served" | base64 -d > "$dir/verdicts.json" || return 1
              { echo "file=$dir/verdicts.json"; echo "sha256=sha256:$sum"; } >> "$dir/outputs"
            else
              echo "no mutation cache for $APP yet; every mutant runs"
            fi
          }
          if fetch; then
            cat "$dir/outputs" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the hub did not serve the mutation cache; every mutant runs"
          fi
          rm -f "$dir/served" "$dir/outputs"

      - name: Quality gate
        id: gate
        env:
          POLICY: ${{ steps.hub.outputs.policy || steps.own.outputs.policy }}
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          BUILT: ${{ steps.image.outcome == 'success' }}
          TOOLCHAIN: ${{ steps.hub.outputs.bin || steps.own.outputs.bin }}
          CACHE_FILE: ${{ steps.cache.outputs.file }}
          CACHE_SHA256: ${{ steps.cache.outputs.sha256 }}
          LAST: ${{ steps.cache.outputs.last }}
        run: |
          set -o pipefail
          export PATH="$TOOLCHAIN:$PATH"
          hub_go="$(go env GOVERSION)"
          unset GOTOOLCHAIN PWD
          if [ "$(go env GOVERSION)" != "$hub_go" ]; then
            echo "::error::go.mod or go.work asks for another Go than the hub's $hub_go"
            exit 1
          fi
          extra=()
          if [ "$BUILT" = true ]; then extra+=(--image "$IMAGE"); fi
          if [ -n "$CACHE_FILE" ]; then extra+=(--mutation-cache "$CACHE_FILE" --mutation-cache-sha256 "$CACHE_SHA256"); fi
          if [ -n "$LAST" ]; then extra+=(--mutation-last "$LAST"); fi
          while sleep 30; do
            echo "resources: $(free -m | awk '/^Mem:/ {print "mem_available_mb=" $7}') $(df -m / "$RUNNER_TEMP" | awk 'NR > 1 {print $6 "_free_mb=" $4}' | tr '\n' ' ')top_dirs_mb=$(du -xsm "$RUNNER_TEMP"/gate/* /tmp 2>/dev/null | sort -rn | head -3 | awk '{printf "%s:%s,", $2, $1}')"
          done &
          deploy-hub gate --app "$APP" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --policy "$POLICY" --src "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/gate" "${extra[@]}"

      - name: Keep gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-reports
          path: |
            ${{ runner.temp }}/gate/verdict.json
            ${{ runner.temp }}/gate/**/mutation.json
            ${{ runner.temp }}/gate/sbom-*.cdx.json
          if-no-files-found: ignore

      - name: Summarize the verdict
        if: always()
        run: |
          verdict="$RUNNER_TEMP/gate/verdict.json"
          if [ ! -s "$verdict" ]; then
            echo "No gate verdict: a step before the gate failed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '"## Gate \(if .passed then "passed" else "failed" end): \(.app) \(.commit[0:7]), \(.seconds | floor) s",
            "", "| check | status | seconds | reason |", "|---|---|---|---|",
            (.results[] | "| \(.check) | \(.status) | \(.seconds | floor) | \(.reason // "" | gsub("[|\n]"; " ")) |")' \
            "$verdict" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the hub binary
        id: binary
        if: env.HUB == 'true'
        run: |
          set -euo pipefail
          make build OUT_DIR="$RUNNER_TEMP/dist" COMMIT="$GITHUB_SHA"
          test "$("$RUNNER_TEMP/dist/deploy-hub" version)" = "$GITHUB_SHA"

      - name: Keep the hub binary
        if: env.HUB == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deploy-hub-linux-amd64
          path: ${{ runner.temp }}/dist/deploy-hub
          if-no-files-found: error

      - name: Publish the hub release
        if: >-
          github.repository == 'DreamsAreReal/deploy-hub' && inputs.app == 'deploy-hub'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.gate.outcome == 'success' && steps.binary.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "the hub release needs the secret RELEASE_TOKEN"; exit 1; }
          cd "$RUNNER_TEMP/dist"
          mv deploy-hub deploy-hub-linux-amd64
          sha256sum deploy-hub-linux-amd64 > deploy-hub-linux-amd64.sha256
          gh release create "sha-$GITHUB_SHA" deploy-hub-linux-amd64 deploy-hub-linux-amd64.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "deploy-hub $GITHUB_SHA" \
            --notes "Built by deploy.yml after the gate passed on main at $GITHUB_SHA."

      - name: Upload the mutation verdicts to the hub
        if: always() && steps.inputs.outcome == 'success' && env.GATE_ONLY != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -uo pipefail
          verdicts="$RUNNER_TEMP/gate/mutation-verdicts.json"
          run="$RUNNER_TEMP/gate/mutation-run.json"
          if [ ! -s "$verdicts" ]; then
            echo "the gate left no mutation verdicts"
            exit 0
          fi
          upload() {
            oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -er .value)" || return 1
            {
              printf 'oidc=%s\n' "$oidc"
              printf 'verdicts=%s\n' "$(base64 -w0 "$verdicts")"
              if [ -s "$run" ]; then printf 'run=%s\n' "$(base64 -w0 "$run")"; fi
            } | ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                  "$VPS_USER@$VPS_HOST" "mutation-cache-put $APP sha-${GITHUB_SHA}"
          }
          upload || echo "::warning::the hub did not take the mutation verdicts; the next run mutates them again"

      - name: Keep the source for the hub's full mutation run
        if: always() && runner.environment == 'self-hosted' && env.GATE_ONLY != 'true' && steps.checkout.outcome == 'success' && steps.hub.outcome == 'success'
        env:
          TOOLCHAIN: ${{ steps.hub.outputs.bin }}
          POLICY: ${{ steps.hub.outputs.policy }}
        run: |
          set -euo pipefail
          root="$HOME/mutation"
          next="$root/stash.next"
          rm -rf "$next"
          install -d -m 700 "$root" "$next"
          git archive --format=tar -o "$next/src.tar" HEAD
          install -m 700 "$TOOLCHAIN/deploy-hub" "$next/deploy-hub"
          cp -r "$(dirname "$POLICY")" "$next/policy"
          cp -a "$(go env GOROOT)" "$next/go"
          printf '%s\n' "$GITHUB_SHA" > "$next/commit"
          rm -rf "$root/stash"
          mv "$next" "$root/stash"
          du -sh "$root/stash"

      - name: Report the verdict to the hub
        if: always() && steps.inputs.outcome == 'success' && env.GATE_ONLY != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          TOOLCHAIN: ${{ steps.hub.outcome }}
          BUILD_INPUTS: ${{ steps.ctx.outcome }}
          IMAGE_BUILD: ${{ steps.image.outcome }}
        run: |
          set -euo pipefail
          verdict="$RUNNER_TEMP/gate/verdict.json"
          if [ ! -s "$verdict" ]; then
            stage=gate
            for pair in "checkout=$CHECKOUT" "toolchain=$TOOLCHAIN" "build-inputs=$BUILD_INPUTS" "image-build=$IMAGE_BUILD"; do
              if [ "${pair#*=}" != success ]; then stage="${pair%%=*}"; break; fi
            done
            echo "no gate verdict was produced; reporting the failed step: $stage"
            mkdir -p "$RUNNER_TEMP/gate"
            jq -n --arg app "$APP" --arg repo "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" --arg check "ci-$stage" \
              '{app: $app, repo: $repo, commit: $commit, own: false, passed: false, seconds: 0,
                results: [{check: $check, status: "fail", reason: "the CI step failed before the gate produced a verdict", seconds: 0}]}' \
              > "$verdict"
          fi
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)"
          {
            printf 'oidc=%s\n' "$oidc"
            printf 'verdict=%s\n' "$(base64 -w0 "$verdict")"
          } | ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                "$VPS_USER@$VPS_HOST" "report $APP sha-${GITHUB_SHA}"

      - name: Push the gated image
        id: push
        if: env.GATE_ONLY != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"
          docker logout ghcr.io
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Deploy on the VPS
        if: env.GATE_ONLY != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          START_EPOCH: ${{ steps.start.outputs.epoch }}
          DIGEST: ${{ steps.push.outputs.digest }}
          BYOC: ${{ steps.ctx.outputs.byoc }}
          BYOC_MAIN: ${{ steps.ctx.outputs.main }}
          BYOC_PORT: ${{ steps.ctx.outputs.port }}
          BYOC_HEALTH: ${{ steps.ctx.outputs.health }}
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s | tr -d '\r\n' | cut -c1-120)"
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)"
          {
            printf 'token=%s\n' "$GH_TOKEN"
            printf 'actor=%s\n' "$ACTOR"
            printf 'subject=%s\n' "$SUBJECT"
            printf 'start=%s\n' "$START_EPOCH"
            printf 'oidc=%s\n' "$oidc"
            printf 'digest=%s\n' "$DIGEST"
            if [ "$BYOC" = 1 ]; then
              printf 'compose=%s\n' "$(base64 -w0 "$RUNNER_TEMP/rendered-compose.yml")"
              printf 'main=%s\n' "$BYOC_MAIN"
              printf 'hport=%s\n' "$BYOC_PORT"
              printf 'hmode=%s\n' "$BYOC_HEALTH"
            fi
          } | ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                "$VPS_USER@$VPS_HOST" "deploy $APP sha-${GITHUB_SHA}"
