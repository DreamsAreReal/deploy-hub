name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain
        run: make toolchain TOOLS_DIR="$RUNNER_TEMP/toolchain"

      - name: Gate
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          export PATH="$RUNNER_TEMP/toolchain:$PATH"
          while sleep 20; do
            echo "resources: $(free -m | awk '/^Mem:/ {print "mem_available_mb=" $7}') $(df -m / "$RUNNER_TEMP" | awk 'NR > 1 {print $6 "_free_mb=" $4}' | tr '\n' ' ')$(ps -eo rss,comm --sort=-rss | awk 'NR == 2 {print "top=" $2 ":" int($1 / 1024) "mb"}')"
          done &
          deploy-hub gate --app deploy-hub --repo "$REPO" --commit "$COMMIT" --policy "$GITHUB_WORKSPACE/policy/gate.yaml" --src "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/gate"

      - name: Build linux binary
        run: make build OUT_DIR="$RUNNER_TEMP/dist"

      - name: Keep gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-reports
          path: |
            ${{ runner.temp }}/gate/verdict.json
            ${{ runner.temp }}/gate/**/mutation.json
            ${{ runner.temp }}/gate/sbom-*.cdx.json
          if-no-files-found: ignore

      - name: Keep binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deploy-hub-linux-amd64
          path: ${{ runner.temp }}/dist/deploy-hub
          if-no-files-found: error
