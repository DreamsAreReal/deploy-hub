name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-gate-{0}', github.event.pull_request.number) || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: quality gate
    permissions: {contents: read, packages: write, id-token: write}
    uses: DreamsAreReal/deploy-hub/.github/workflows/deploy.yml@main
    with: {app: deploy-hub}
    secrets:
      RELEASE_TOKEN: ${{ github.event_name == 'push' && secrets.RELEASE_TOKEN || '' }}
