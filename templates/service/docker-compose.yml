services:
  app:
    build: .
    container_name: starter
    ports:
      - "127.0.0.1:9099:8080"
    env_file: .env
    networks: [shared]
    healthcheck:
      test: ["CMD", "/starter", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    external: true
